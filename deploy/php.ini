; Apply to a dedicated PHP-FPM pool/runtime, not an exposed .user.ini.
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off
allow_url_include = Off
allow_url_fopen = Off
session.use_cookies = On
session.use_only_cookies = On
session.use_strict_mode = On
session.use_trans_sid = Off
session.cookie_secure = On
session.cookie_httponly = On
session.cookie_samesite = Lax
post_max_size = 256K
upload_max_filesize = 256K
file_uploads = Off
max_input_vars = 200
memory_limit = 128M
max_execution_time = 240
; proc_open/proc_get_status/proc_terminate/proc_close are required for DNS tools.
; Other execution APIs are unused; tailor this list to the dedicated pool.
disable_functions = exec,shell_exec,system,passthru,popen,pcntl_exec
; If using open_basedir, include application, private session/transfer storage,
; DNS tool binaries and runtime requirements. It does not constrain subprocesses;
; use OS permissions, an isolated service account and an egress firewall as well.
