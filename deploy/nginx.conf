# Example dedicated HTTPS server; substitute certificate/socket/root paths.
# Add a separate port-80 server returning a redirect to your fixed HTTPS hostname.
server {
    listen 443 ssl;
    server_name dns.example.com;
    ssl_certificate /etc/ssl/vegadns/fullchain.pem;
    ssl_certificate_key /etc/ssl/vegadns/privkey.pem;
    root /srv/vegadns;
    index index.php;
    client_max_body_size 256k;
    # Disable default access logging here: it commonly includes reset-token queries.
    # To enable it, define an http{} log_format using $uri, never $request/$args.
    access_log off;
    location = / { return 302 /index.php; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/vegadns/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/vegadns.sock;
    }
    location = /assets/app.css { try_files $uri =404; }
    location / { return 404; }
}
